    .container {
      display: grid;

    }

    .card {
      background: #111;

      transition: 0.3s;
    }
    
    .card.destaque {
  border: 2px solid gold;

}

    .card:hover {
      transform: scale(1.05);

    }

    .card img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .card h3 {
      margin-bottom: 10px;
    }

    .card a {
      display: inline-block;
      padding: 10px 15px;
      background: #00eaff;
      color: #000;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .card a:hover {
      background: #00bcd4;
    }

  </style></head>

  const searchInput = document.getElementById("searchInput");
  const cards = document.querySelectorAll(".card");

  searchInput.addEventListener("keyup", function () {

    cards.forEach(card => {
      const title = card.querySelector("h3").textContent.toLowerCase();

      if (title.includes(filter)) {
